[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo",
  "php84Extensions.pdo_mysql",
  "php84Extensions.mysqli",
  "php84Extensions.mbstring",
  "php84Extensions.json",
  "php84Extensions.curl",
  "php84Extensions.openssl",
  "php84Extensions.session",
  "php84Extensions.tokenizer",
  "nginx"
]

[phases.build]
cmds = [
  "php -r \"echo 'pdo_mysql: ' . (extension_loaded('pdo_mysql') ? 'OK ✅' : 'MISSING ❌') . PHP_EOL;\""
]

[start]
cmd = "bash /app/start.sh"
