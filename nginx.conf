server {
    listen $PORT;
    server_name _;
    root /app;
    index index.php;

    # ── Security: block direct access to sensitive directories ────────────────
    location ~ ^/(core|config|migrations|logs)(/|$) {
        return 403;
    }

    # Block dot files (.env, .htaccess, etc.)
    location ~ /\. {
        return 403;
    }

    # Block direct PHP access to anything except index.php
    location ~ \.php$ {
        if ($uri !~ ^/index\.php$) {
            return 403;
        }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "session.save_path=/tmp/sessions";
    }

    # ── Front controller: route everything through index.php ──────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static assets: serve directly with cache headers ─────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
